apiVersion: 1
datasources:
  # Log arama — mevcut Loki/promtail zinciri.
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000

  # Metrikler (Faz 11). Panolar bu `uid`'yi doğrudan yazar; varsayılan veri kaynağını
  # değiştirmek mevcut kayıtlı log sorgularını bozardı.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      httpMethod: POST
      timeInterval: 15s
