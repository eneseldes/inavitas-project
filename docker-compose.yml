services:
  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_root_pw
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports: ["8090:8080"]
    depends_on:
      kafka:
        condition: service_healthy

  # --- Uygulama Servisleri ---------------------------------------------------
  # Dört backend servisi tek imajı (kök `Dockerfile`) paylaşır. Dışa yalnızca
  # `web` (nginx, :80) açıktır; `gateway` dahil hiçbiri host'a port açmaz.

  access-service:
    image: inavitas-backend:latest
    build: .
    command: ["node", "services/access-service/dist/index.js"]
    # Pino log dosyalarını host'un ./logs klasörüne aç ki promtail toplayabilsin.
    volumes:
      - ./logs:/app/logs
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      ACCESS_SERVICE_PORT: "3001"
      ACCESS_APP_DATABASE_URL: postgresql://access_app:access_app_pw@postgres:5432/access_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  outage-service:
    image: inavitas-backend:latest
    build: .
    command: ["node", "services/outage-service/dist/index.js"]
    volumes:
      - ./logs:/app/logs
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      OUTAGE_SERVICE_PORT: "3002"
      OUTAGE_APP_DATABASE_URL: postgresql://outage_app:outage_app_pw@postgres:5432/outage_db
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-inavitas}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  work-order-service:
    image: inavitas-backend:latest
    build: .
    command: ["node", "services/work-order-service/dist/index.js"]
    volumes:
      - ./logs:/app/logs
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      WORK_ORDER_SERVICE_PORT: "3003"
      WORK_ORDER_APP_DATABASE_URL: postgresql://work_order_app:work_order_app_pw@postgres:5432/work_order_db
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-inavitas}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  translation-service:
    image: inavitas-backend:latest
    build: .
    command: ["node", "services/translation-service/dist/index.js"]
    volumes:
      - ./logs:/app/logs
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      TRANSLATION_SERVICE_PORT: "3004"
      TRANSLATION_APP_DATABASE_URL: postgresql://translation_app:translation_app_pw@postgres:5432/translation_db
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-inavitas}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-none}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  network-service:
    image: inavitas-backend:latest
    build: .
    command: ["node", "services/network-service/dist/index.js"]
    volumes:
      - ./logs:/app/logs
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      NETWORK_SERVICE_PORT: "3005"
      NETWORK_APP_DATABASE_URL: postgresql://network_app:network_app_pw@postgres:5432/network_db
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-inavitas}
    expose: ["3005"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3005/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  gateway:
    image: inavitas-backend:latest
    build: .
    command: ["node", "services/gateway/dist/index.js"]
    volumes:
      - ./logs:/app/logs
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      GATEWAY_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      ACCESS_SERVICE_HOST: access-service
      OUTAGE_SERVICE_HOST: outage-service
      WORK_ORDER_SERVICE_HOST: work-order-service
      TRANSLATION_SERVICE_HOST: translation-service
      NETWORK_SERVICE_HOST: network-service
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    # Dışa port açmaz, yalnızca docker network üzerinden erişilir.
    expose: ["8080"]
    depends_on:
      redis: { condition: service_healthy }
      access-service: { condition: service_healthy }
      outage-service: { condition: service_healthy }
      work-order-service: { condition: service_healthy }
      translation-service: { condition: service_healthy }
      network-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  web:
    image: inavitas-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports: ["80:80"]
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      # `localhost` konteyner içinde önce IPv6 (`::1`) çözülüyor; nginx yalnızca
      # IPv4 dinlediğinden bu "connection refused" ile yanlış pozitif veriyordu.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  loki:
    image: grafana/loki:3.3.0
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
    ports: ["3100:3100"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  promtail:
    image: grafana/promtail:3.3.0
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./logs:/var/log/inavitas:ro
      - promtailpositions:/tmp
    depends_on:
      loki:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      # Geliştirme modunda servisler host'ta çalışır, konteynerde değil; o modda
      # `PROMETHEUS_CONFIG=prometheus.dev.yml` verilir (hedefler `host.docker.internal`).
      - ./observability/${PROMETHEUS_CONFIG:-prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      # Panolar dosyadan sağlanır: elle düzenlenen bir pano konteyner silinince kaybolur.
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafanadata:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  lokidata:
  promtailpositions:
  grafanadata:
  prometheusdata: